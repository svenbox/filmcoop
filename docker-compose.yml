services:
  app:
    build: ./app
    container_name: filmcoop_app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - filmcoop_data:/data
    networks:
      - filmcoop_net
      - mediastack

volumes:
  filmcoop_data:

networks:
  filmcoop_net:
    internal: true
  mediastack:
    external: true
